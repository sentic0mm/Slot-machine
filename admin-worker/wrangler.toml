name = "slotmachine-admin"
main = "src/index.js"
compatibility_date = "2024-09-01"

# Eigene Adresse, getrennt vom Spiel-Worker - so kann Cloudflare Access
# diesen Worker komplett sperren, ohne das Spiel zu stören.
workers_dev = true
preview_urls = false

[observability]
enabled = true

# Login geht direkt an den Spiel-Worker (intern, nicht übers Internet)
[[services]]
binding = "GAME"
service = "slotmachine-leaderboard"

[vars]
FIREBASE_DB_URL = "https://slot-machine-multiplayer-default-rtdb.europe-west1.firebasedatabase.app"

# Alles Persönliche ist ein Secret (Repo ist öffentlich), siehe README.md:
#   FIREBASE_SERVICE_ACCOUNT_KEY, ADMIN_SECRET, ADMIN_UID, ADMIN_EMAIL,
#   ACCESS_TEAM_DOMAIN, ACCESS_AUD, ADMIN_DEVICE_KEYS
